name: Compila windhawk-share

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compila la versione da terminale
        run: dotnet publish WindhawkShare.csproj -c Release -r ${{ matrix.rid }} -o publish/cli

      - name: Compila la versione grafica
        run: dotnet publish gui/WindhawkShare.Gui.csproj -c Release -r ${{ matrix.rid }} -o publish/gui

      - name: Rinomina per architettura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item publish/cli/windhawk-share.exe "dist/windhawk-share-${{ matrix.rid }}.exe"
          Move-Item publish/gui/windhawk-share-gui.exe "dist/windhawk-share-gui-${{ matrix.rid }}.exe"

      - name: Carica gli eseguibili
        uses: actions/upload-artifact@v4
        with:
          name: windhawk-share-${{ matrix.rid }}
          path: dist/*.exe

      - name: Pubblica la release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
